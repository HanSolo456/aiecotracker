        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0F1E;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        /* Custom Colors */
        .border-sensor { border-color: #00D4FF; color: #00D4FF; }
        .bg-sensor { background-color: rgba(0, 212, 255, 0.1); }
        
        .border-hardware { border-color: #6366F1; color: #6366F1; } /* Indigo */
        .bg-hardware { background-color: rgba(99, 102, 241, 0.1); }
        
        .border-api { border-color: #A855F7; color: #A855F7; } /* Purple */
        .bg-api { background-color: rgba(168, 85, 247, 0.1); }
        
        .border-db { border-color: #F97316; color: #F97316; } /* Orange */
        .bg-db { background-color: rgba(249, 115, 22, 0.1); }
        
        .border-ai { border-color: #00FF88; color: #00FF88; } /* Green */
        .bg-ai { background-color: rgba(0, 255, 136, 0.1); }
        
        .border-app { border-color: #EC4899; color: #EC4899; } /* Pink */
        .bg-app { background-color: rgba(236, 72, 153, 0.1); }

        /* Circuit Background */
        .circuit-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 50% 50%, rgba(10, 25, 47, 0) 0%, #0A0F1E 90%),
                              url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20 L20 30 L80 30' stroke='%231F2937' stroke-width='0.5' fill='none'/%3E%3Cpath d='M50 50 L50 60 L10 60' stroke='%231F2937' stroke-width='0.5' fill='none'/%3E%3Crect x='18' y='18' width='4' height='4' fill='%231F2937'/%3E%3C/svg%3E");
            opacity: 0.6;
            z-index: 0;
        }

        /* Node Styling */
        .arch-node {
            position: absolute;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 9999px; /* Pill shape */
            border-width: 1px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: transform 0.3s ease;
        }
        
        .arch-node:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .node-icon {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        /* SVG Connectors */
        .connector-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .connector-path {
            fill: none;
            stroke-width: 2;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2s forwards ease-out;
        }

        /* Flow Animations */
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        .flow-particle {
            fill: white;
            opacity: 0;
            animation: flow 3s infinite linear;
        }

        @keyframes flow {
            0% { offset-distance: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }

        /* Legend */
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            color: #9CA3AF;
            margin-right: 16px;
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
