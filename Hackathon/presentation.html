<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-EcoTrack Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #presentation-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Overlay to catch mouse events */
        #mouse-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        /* Slide Counter */
        .slide-counter {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Space Grotesk', sans-serif;
            color: #00FF88;
            font-weight: 600;
            font-size: 14px;
            z-index: 1000;
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            display: none;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="presentation-container">
        <iframe id="slide-frame" src="page_01.html"></iframe>
        <div id="mouse-overlay"></div>
    </div>

    <div class="slide-counter" id="slide-counter">1 / 8</div>

    <script>
        const slides = [
            'page_01.html',
            'page_02.html',
            'page_03.html',
            'page_04.html',
            'page_05.html',
            'page_06.html',
            'page_07.html',
            'page_08.html'
        ];

        let currentSlide = 0;
        const iframe = document.getElementById('slide-frame');
        const slideCounter = document.getElementById('slide-counter');

        function updateSlide() {
            iframe.src = slides[currentSlide];
            slideCounter.textContent = `${currentSlide + 1} / ${slides.length}`;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }

        function firstSlide() {
            currentSlide = 0;
            updateSlide();
        }

        function lastSlide() {
            currentSlide = slides.length - 1;
            updateSlide();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            }
        }

        // Mouse wheel navigation
        let isScrolling = false;
        const overlay = document.getElementById('mouse-overlay');
        
        overlay.addEventListener('wheel', (e) => {
            if (isScrolling) return;
            
            e.preventDefault();
            e.stopPropagation();
            
            isScrolling = true;
            
            if (e.deltaY > 0) {
                nextSlide();
            } else if (e.deltaY < 0) {
                prevSlide();
            }
            
            // Reset scrolling flag after delay
            setTimeout(() => {
                isScrolling = false;
            }, 500);
        }, { passive: false });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowRight':
                case 'ArrowDown':
                    e.preventDefault();
                    nextSlide();
                    break;
                case 'ArrowLeft':
                case 'ArrowUp':
                    e.preventDefault();
                    prevSlide();
                    break;
                case 'f':
                case 'F':
                    e.preventDefault();
                    toggleFullscreen();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    break;
            }
        });

        // Initialize
        updateSlide();
    </script>
</body>
</html>
