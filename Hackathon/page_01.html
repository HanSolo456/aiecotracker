<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-EcoTrack Title Slide</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#0A0F1E; color:#fff; margin:0; padding:0; overflow:hidden; }
  .font-heading { font-family:'Space Grotesk',sans-serif; }
  .text-green { color:#00FF88; }
  .text-cyan  { color:#00D4FF; }
  .circuit-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10 L20 10 L20 20' stroke='%231F2937' stroke-width='1' fill='none'/%3E%3Cpath d='M80 80 L70 80 L70 90' stroke='%231F2937' stroke-width='1' fill='none'/%3E%3Ccircle cx='20' cy='20' r='1.5' fill='%23374151'/%3E%3C/svg%3E");
    opacity:0.4; z-index:1;
  }
  .glow-orb-1 { position:absolute; top:15%; left:20%; width:420px; height:420px; background:#00FF88; border-radius:50%; filter:blur(160px); opacity:0.07; z-index:0; }
  .glow-orb-2 { position:absolute; bottom:10%; right:15%; width:500px; height:500px; background:#00D4FF; border-radius:50%; filter:blur(180px); opacity:0.07; z-index:0; }
  .glass-panel { background:rgba(255,255,255,0.03); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.08); box-shadow:0 8px 32px rgba(0,0,0,0.2); }
  .hero-shadow { text-shadow:0 0 40px rgba(0,255,136,0.25); }
  .logo-ring { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:140px; height:140px; border:1px solid rgba(0,255,136,0.3); border-radius:50%; animation:pulse 4s infinite; }
  .logo-ring-inner { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:108px; height:108px; border:1px dashed rgba(0,212,255,0.4); border-radius:50%; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(0,255,136,0.15)} 70%{box-shadow:0 0 0 22px rgba(0,255,136,0)} 100%{box-shadow:0 0 0 0 rgba(0,255,136,0)} }
  .tag { display:inline-flex; align-items:center; gap:6px; padding:4px 14px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="relative flex flex-col items-center justify-center overflow-hidden" style="width:100vw;height:100vh;">
  <div class="circuit-overlay"></div>
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <!-- Background tech icons -->
  <div class="absolute top-8 right-10 text-gray-800 opacity-20 z-0"><i class="fas fa-microchip fa-6x"></i></div>
  <div class="absolute bottom-8 left-10 text-gray-800 opacity-20 z-0"><i class="fas fa-satellite-dish fa-6x"></i></div>
  <div class="absolute top-1/3 right-8 text-gray-800 opacity-10 z-0"><i class="fas fa-route fa-4x"></i></div>

  <!-- Main content -->
  <div class="z-10 w-full max-w-5xl flex flex-col items-center justify-center px-8">
    <!-- Logo -->
    <div class="relative w-36 h-36 mb-8 flex items-center justify-center">
      <div class="logo-ring"></div>
      <div class="logo-ring-inner"></div>
      <div class="relative z-20 flex flex-col items-center justify-center">
        <i class="fas fa-recycle text-5xl" style="color:#00FF88"></i>
      </div>
    </div>

    <!-- Title -->
    <div class="text-center mb-3">
      <h1 class="font-heading font-bold tracking-tight text-white mb-2 hero-shadow" style="font-size:5.5rem;line-height:1">
        AI-<span style="color:#00FF88">EcoTrack</span>
      </h1>
    </div>

    <!-- Tagline -->
    <div class="flex items-center justify-center mb-4 w-full max-w-2xl">
      <div class="h-px flex-1 bg-gray-700"></div>
      <p class="mx-5 font-heading text-lg text-gray-300 font-light tracking-widest uppercase text-center">
        AI-Driven Circular Waste Intelligence System
      </p>
      <div class="h-px flex-1 bg-gray-700"></div>
    </div>

    <!-- Flow tags -->
    <div class="flex items-center gap-3 mb-10">
      <span class="tag" style="background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);color:#00FF88"><i class="fas fa-search"></i> Identify</span>
      <i class="fas fa-arrow-right text-gray-600 text-sm"></i>
      <span class="tag" style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:#00D4FF"><i class="fas fa-shield-alt"></i> Safeguard</span>
      <i class="fas fa-arrow-right text-gray-600 text-sm"></i>
      <span class="tag" style="background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.3);color:#A78BFA"><i class="fas fa-passport"></i> Passport</span>
      <i class="fas fa-arrow-right text-gray-600 text-sm"></i>
      <span class="tag" style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);color:#FBBF24"><i class="fas fa-route"></i> Optimize</span>
    </div>

    <!-- Team card -->
    <div class="glass-panel rounded-2xl p-1 w-full max-w-3xl">
      <div class="flex rounded-xl overflow-hidden">
        <div class="flex-1 p-5 flex flex-col items-center justify-center relative">
          <div class="absolute top-0 left-0 w-full h-0.5" style="background:linear-gradient(90deg,transparent,#00FF88,transparent);opacity:0.6"></div>
          <i class="fas fa-users mb-2" style="color:#00FF88"></i>
          <p class="text-xs font-bold tracking-widest text-gray-500 uppercase mb-1">Presented By</p>
          <p class="font-heading text-xl font-bold text-white">Team MakersLab</p>
          <p class="text-sm text-gray-400 mt-1">Saumitra Matta &nbsp;·&nbsp; Satyam Anand &nbsp;·&nbsp; Siddharth Singh</p>
        </div>
        <div class="w-px bg-gray-800"></div>
        <div class="flex-1 p-5 flex flex-col items-center justify-center">
          <i class="fas fa-code-branch mb-2 text-gray-500"></i>
          <p class="text-xs font-bold tracking-widest text-gray-500 uppercase mb-1">Platform</p>
          <p class="font-heading text-sm font-semibold text-gray-300">Next.js · Firebase · Groq · ESP32 · Raspberry Pi</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="absolute bottom-0 w-full flex justify-between px-8 py-4 text-xs font-mono text-gray-600 uppercase tracking-widest z-10">
    <p>System Status: <span style="color:#00FF88">Online</span></p>
    <p>Hackathon 2025 &nbsp;·&nbsp; AI-EcoTrack v1.0</p>
  </div>
</div>
</body></html>
