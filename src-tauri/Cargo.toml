[package]
name = "aiecotrack_desktop"
version = "0.1.0"
description = "AI-EcoTrack desktop shell"
authors = ["AI-EcoTrack"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
